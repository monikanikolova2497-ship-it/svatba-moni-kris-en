<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wedding invitation for Monika and Kristiyan – 17 July 2027, Sofia">
<meta property="og:title" content="Monika & Kristiyan – Wedding Invitation">
<meta property="og:description" content="17 July 2027 · Sofia. Open your invitation!">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Monika and Kristiyan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@500;600&display=swap">
<style>
/* Layout: one full-screen "table" scene; the invitation pieces are stacked layers driven by a 5-step state machine. Single deliberate look (letterpress on linen). */
:root{
  --linen:#d5dbe1;
  --linen-hi:#eef0f1;
  --navy:#1c2a48;
  --wine:#7b1f2c;
  --gold:#a8834a;
  --paper:#f7f1e6;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--navy);font-family:var(--sans);
  background:var(--linen);
  background-image:
    radial-gradient(ellipse 70% 55% at 50% 45%, var(--linen-hi) 0%, rgba(238,240,241,0) 70%),
    repeating-linear-gradient(0deg, rgba(28,42,72,.025) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(28,42,72,.02) 0 1px, transparent 1px 4px);
  -webkit-tap-highlight-color:transparent;
}
.app{position:relative;height:100%;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}

/* header */
.head{position:absolute;left:0;right:0;top:0;z-index:20;text-align:center;padding-top:14px;pointer-events:none;transition:opacity .6s}
.head h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(22px,4.2vw,30px);line-height:1.1;letter-spacing:.01em;color:var(--navy);text-wrap:balance}
.head p{margin:4px 0 0;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* flight path ornament */
.route{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55}
.route svg{position:absolute;left:0;top:0;width:100%;height:100%}

/* stage */
#stage{position:absolute;inset:0;z-index:1;outline:none;cursor:pointer;opacity:0;transition:opacity .8s}
#stage.ready{opacity:1}
#stage:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.L{position:absolute;left:0;top:0;will-change:transform,opacity}
.L img,.fill{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.shadowed{filter:drop-shadow(0 18px 22px rgba(28,42,72,.22)) drop-shadow(0 3px 5px rgba(28,42,72,.18))}

#envC{z-index:5}
#cFlap{transform-origin:50% 0;backface-visibility:hidden}
#seal{position:absolute;left:40.22%;top:45.86%;width:19.07%;height:29.75%}
#seal img{animation:breathe 2.4s ease-in-out infinite}
#seal::after{content:"";position:absolute;left:8%;top:6%;width:84%;height:80%;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes ring{0%{transform:scale(.9);opacity:.0}15%{opacity:.75}100%{transform:scale(1.45);opacity:0}}

#oWrap{z-index:1;transform-origin:50% 100%}
#oFlap{transform-origin:50% 39.48%;backface-visibility:hidden}
#oFront{z-index:4;transform-origin:50% 100%}

#pp{z-index:3;transform-origin:0 0}
#pCover{transform-origin:0 50%;backface-visibility:hidden}
#sheen{position:absolute;inset:1% 2% 1% 1%;border-radius:2.5%;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .6s}
#sheen::before{content:"";position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,rgba(255,236,200,0),rgba(255,236,200,.28),rgba(255,236,200,0));animation:sweep 3.6s ease-in-out infinite}
#pp.glint #sheen{opacity:1}
@keyframes sweep{0%,35%{left:-60%}75%,100%{left:130%}}

#spread{z-index:6;visibility:hidden}
#pTop{position:absolute;left:0;top:0;width:100%;height:49.885%;transform-origin:50% 100%;backface-visibility:hidden}
#pBot{position:absolute;left:0;top:49.885%;width:100%;height:50.115%}
#pTop img,#pBot img{position:absolute;inset:0;width:100%;height:100%}

#ticket{z-index:5;transform-origin:50% 50%}

#fx{position:absolute;inset:0;z-index:15;pointer-events:none;width:100%;height:100%}

/* bottom controls */
.foot{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 16px calc(18px + env(safe-area-inset-bottom, 0px));pointer-events:none}
.hint{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--paper);color:var(--navy);font-size:13px;font-weight:600;letter-spacing:.02em;box-shadow:0 6px 18px rgba(28,42,72,.14);border:1px solid rgba(168,131,74,.35);transition:opacity .35s, transform .35s}
.hint.off{opacity:0;transform:translateY(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 0 rgba(123,31,44,.5);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(123,31,44,0)}100%{box-shadow:0 0 0 0 rgba(123,31,44,0)}}
.end{display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:auto;width:100%;max-width:420px}
.end .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rsvp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;padding:16px 24px;border-radius:999px;background:var(--wine);color:var(--paper);text-decoration:none;font:600 16px/1.1 var(--sans);letter-spacing:.03em;border:1px solid var(--gold);box-shadow:0 10px 26px rgba(123,31,44,.35),0 0 0 4px rgba(168,131,74,.18);animation:rsvpIn .7s cubic-bezier(.22,1,.36,1) both, rsvpPulse 2.6s ease-in-out .9s infinite}
.rsvp:hover{filter:brightness(1.08)}
.rsvp:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.rsvp svg{width:18px;height:18px;flex:none}
@keyframes rsvpIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rsvpPulse{0%,100%{box-shadow:0 10px 26px rgba(123,31,44,.35),0 0 0 4px rgba(168,131,74,.18)}50%{box-shadow:0 10px 26px rgba(123,31,44,.35),0 0 0 9px rgba(168,131,74,.10)}}
[hidden]{display:none!important}
.btn{appearance:none;border:1px solid rgba(168,131,74,.5);background:var(--paper);color:var(--navy);font:600 13px/1 var(--sans);letter-spacing:.02em;padding:11px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(28,42,72,.12)}
.btn.primary{background:var(--paper);color:var(--navy)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:15px;height:15px}
.rot{display:none;font-size:11.5px;color:var(--navy);opacity:.7;width:100%;text-align:center;letter-spacing:.04em}
.portrait .rot{display:block}

.loader{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--gold);z-index:30;transition:opacity .5s;pointer-events:none}
.loader.gone{opacity:0}
@media (prefers-reduced-motion: reduce){
  #seal img,#seal::after,#sheen::before,.dot,.route-plane,.rsvp{animation:none!important}
}
</style>
</head>
<body>


<div class="app" id="app">
  <div class="route" aria-hidden="true">
    <svg viewBox="0 0 1000 600" preserveAspectRatio="none">
      <path id="rp" d="M-40 520 C 180 420, 260 160, 470 170 S 760 330, 1040 60" fill="none" stroke="#a8834a" stroke-width="1.4" stroke-dasharray="2 7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <header class="head" id="head">
    <h1>Monika &amp; Kristiyan</h1>
    <p>17 · 07 · 2027 &nbsp;·&nbsp; Sofia</p>
  </header>

  <div id="stage" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="L shadowed" id="oWrap">
      <div class="fill" id="oFlap"><img src="o_flap.webp" alt=""></div>
      <img src="o_back.webp" alt="">
    </div>
    <div class="L" id="ticket"><img src="ticket.webp" alt="Wedding boarding pass: St. Sophia Church at 16:00, Laura Restaurant at 18:00. RSVP by 15 June 2027." class="shadowed"></div>
    <div class="L" id="pp">
      <div class="fill" id="pCover"><img src="p_closed.webp" alt="Wedding passport" class="shadowed"></div>
      <div id="sheen"></div>
    </div>
    <div class="L" id="oFront"><img src="o_front.webp" alt=""></div>
    <div class="L" id="spread">
      <div id="pBot"><img src="p_bottom.webp" alt="Wedding passport: Monika and Kristiyan, Victoria and Stanislav Atanasovi, 17 July 2027" class="shadowed"></div>
      <div id="pTop"><img src="p_top.webp" alt="Two people in love, one flight with no return ticket. Join us on the day we say I do!" class="shadowed"></div>
    </div>
    <div class="L shadowed" id="envC">
      <img id="cBody" src="c_body.webp" alt="">
      <div class="fill" id="cFlap">
        <img src="c_flap.webp" alt="Envelope with M&amp;K wax seal">
        <div id="seal"><img src="seal.webp" alt=""></div>
      </div>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="foot">
    <div class="hint" id="hint" aria-live="polite"><span class="dot"></span><span id="hintText">Tap the seal to open</span></div>
    <div class="end" id="end" hidden>
      <a class="rsvp" id="rsvp" href="https://form.jotform.com/263094141844356" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        RSVP
      </a>
      <div class="row">
        <button class="btn" id="copy" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          <span id="copyText">0897 775 642</span>
        </button>
        <button class="btn primary" id="replay" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          Start again
        </button>
      </div>
      <span class="rot">Rotate your phone for larger text</span>
    </div>
  </div>
  <div class="loader" id="loader">Preparing your invitation…</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const E = { envC:$('envC'), cBody:$('cBody'), cFlap:$('cFlap'), seal:$('seal'),
    oWrap:$('oWrap'), oFlap:$('oFlap'), oFront:$('oFront'),
    pp:$('pp'), pCover:$('pCover'), spread:$('spread'), pTop:$('pTop'), ticket:$('ticket') };
  const stage = $('stage'), app = $('app'), head = $('head');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EASE = { in:'cubic-bezier(.55,0,.8,.35)', out:'cubic-bezier(.22,1,.36,1)', io:'cubic-bezier(.65,0,.35,1)', back:'cubic-bezier(.3,1.35,.55,1)' };
  const HINTS = ['Tap the seal to open','Tap to take out the passport','Tap the passport to open','Tap to collect your boarding pass',''];
  const LABELS = ['Open the envelope','Take out the passport','Open the passport','Collect your boarding pass',''];

  // image proportions (cropped layers)
  const R = { env: 931/1442, openH: 993/1085, openBody: 0.6052, pass: 1211/887, spread: 870/964, ticket: 498/1897 };

  let phase = 0, busy = false, G = {};

  function box(el, x, y, w, h){ Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'}); }

  function layout(){
    const W = stage.clientWidth, H = stage.clientHeight;
    const top = 74, bot = H - 84, aH = bot - top, cx = W/2, cy = top + aH/2;
    const portrait = H > W * 1.05;
    app.classList.toggle('portrait', portrait);
    const maxW = W - 32;

    // envelope
    const EW = Math.min(maxW, aH * 0.92 / R.openH, 820), EH = EW * R.env;
    const OH = EW * R.openH, bodyN = OH * R.openBody;
    const eBottom = cy + OH/2, ex = cx - EW/2, ey = eBottom - EH;
    box(E.envC, ex, ey, EW, EH);
    box(E.oWrap, ex, eBottom - OH, EW, OH);
    box(E.oFront, ex, eBottom - OH, EW, OH);
    const s = EH / bodyN, bodyTop = eBottom - bodyN;

    // closed passport (centered)
    const FH = Math.min(aH * 0.86, (maxW) * R.pass, 640), FW = FH / R.pass;
    const px = cx - FW/2, py = cy - FH/2;
    box(E.pp, px, py, FW, FH);
    const PW0 = EW * 0.36, PH0 = PW0 * R.pass, k0 = PW0 / FW;
    const inX = cx - PW0/2 - px;
    const inEnv = `translate(${inX}px,${bodyTop + bodyN*0.04 - py}px) scale(${k0})`;
    const outEnv = `translate(${inX}px,${bodyTop + bodyN*0.2 - PH0 - py}px) scale(${k0})`;

    // open spread + ticket peeking below
    const SW = Math.min(maxW, aH / (R.spread + 0.92*R.ticket*0.45), 560), SH = SW * R.spread;
    const peekW = SW * 0.92, peekH = peekW * R.ticket;
    const sTop = top + (aH - (SH + 0.45*peekH)) / 2, sx = cx - SW/2, sBottom = sTop + SH;
    box(E.spread, sx, sTop, SW, SH);

    // ticket base box: landscape fit of the free area
    const TW = Math.min(maxW, aH / R.ticket, 1100), TH = TW * R.ticket;
    const tx = cx - TW/2, ty = cy - TH/2;
    box(E.ticket, tx, ty, TW, TH);
    const kPeek = peekW / TW;
    const peekCy = sBottom - 0.55*peekH + peekH/2;
    const tPeek = (dy, rot) => `translate(0px,${peekCy + dy - cy}px) rotate(${rot}deg) scale(${kPeek})`;
    let tFinal;
    // final ticket sits above the end controls (RSVP button + small row)
    const endEl = $('end'), hintEl = $('hint'), wasHidden = endEl.hidden, hintWas = hintEl.hidden;
    endEl.style.visibility = 'hidden'; endEl.hidden = false; hintEl.hidden = true;
    const endH = endEl.offsetHeight || (portrait ? 140 : 104);
    endEl.hidden = wasHidden; hintEl.hidden = hintWas; endEl.style.visibility = '';
    const topF = 16, botF = H - endH - 34, aHF = botF - topF, cyF = (topF + botF) / 2;
    if (portrait){
      const kp = Math.min(aHF / TW, maxW / TH) * 0.97;
      const cyP = Math.max(cyF, botF - TW*kp/2 - 6);
      tFinal = `translate(0px,${cyP - cy}px) rotate(90deg) scale(${kp})`;
    } else {
      const kl = Math.min(1, aHF / TH);
      const cyL = Math.max(cyF, botF - TH*kl/2 - 40);
      tFinal = `translate(0px,${cyL - cy}px) rotate(0deg) scale(${kl})`;
    }
    E.envC.style.perspective = (EW*2.4)+'px';
    E.oWrap.style.perspective = (EW*2.4)+'px';
    E.pp.style.perspective = (FW*3)+'px';
    E.spread.style.perspective = (SW*3)+'px';
    G = { W,H,EW,EH,s,inEnv,outEnv,peekH,tPeekHidden:tPeek(-0.6*peekH, 0), tPeek:tPeek(0,-1.5), tOut:tPeek(0.5*peekH, 2), tFinal, portrait };
  }

  function stateOf(p){
    const g = G, S = {};
    S.envC   = p===0 ? {opacity:1, visibility:'visible'} : {opacity:0, visibility:'hidden'};
    S.cBody  = {opacity: p===0?1:0};
    S.cFlap  = p===0 ? {transform:'rotateX(0deg)', opacity:1, filter:'brightness(1)'} : {transform:'rotateX(90deg)', opacity:0, filter:'brightness(.75)'};
    const envT = p===0 ? `translateY(0px) scaleY(${g.s})` : p===1 ? 'translateY(0px) scaleY(1)' : `translateY(${g.EW*0.55}px) scaleY(1)`;
    const envO = p===1 ? 1 : 0;
    S.oWrap  = {transform:envT, opacity:envO, visibility: p<=2?'visible':'hidden'};
    S.oFront = {transform:envT, opacity:envO, visibility: p<=2?'visible':'hidden'};
    S.oFlap  = p===0 ? {transform:'rotateX(-90deg)', opacity:0, filter:'brightness(.7)'} : {transform:'rotateX(0deg)', opacity:1, filter:'brightness(1)'};
    S.pp     = p<=1 ? {transform:g.inEnv, zIndex:3, opacity:1, visibility:'visible'} : p===2 ? {transform:'translate(0px,0px) scale(1)', zIndex:7, opacity:1, visibility:'visible'} : {transform:'translate(0px,0px) scale(1)', zIndex:6, opacity:0, visibility:'hidden'};
    S.pCover = p<=2 ? {transform:'rotateY(0deg)', filter:'brightness(1)'} : {transform:'rotateY(-90deg)', filter:'brightness(.6)'};
    S.spread = p<=2 ? {opacity:0, transform:'scale(.82)', filter:'blur(0px)', visibility:'hidden'} : p===3 ? {opacity:1, transform:'scale(1)', filter:'blur(0px)', visibility:'visible'} : {opacity:.2, transform:'scale(.9)', filter:'blur(2px)', visibility:'visible'};
    S.pTop   = p<=2 ? {transform:'rotateX(-90deg)', filter:'brightness(.7)'} : {transform:'rotateX(0deg)', filter:'brightness(1)'};
    S.ticket = p<=2 ? {transform:g.tPeekHidden, opacity:0, zIndex:5} : p===3 ? {transform:g.tPeek, opacity:1, zIndex:5} : {transform:g.tFinal, opacity:1, zIndex:7};
    return S;
  }

  function apply(p){
    const S = stateOf(p);
    for (const k in S){ E[k].getAnimations().forEach(a=>a.cancel()); Object.assign(E[k].style, S[k]); }
    E.pp.classList.toggle('glint', p===2);
    head.style.opacity = (p===4) ? 0 : 1;
    const hint = $('hint');
    hint.classList.toggle('off', p===4 || busy);
    hint.hidden = p===4;
    $('hintText').textContent = HINTS[p];
    $('end').hidden = p!==4;
    stage.setAttribute('aria-label', LABELS[p] || 'Invitation');
    stage.style.cursor = p===4 ? 'default' : 'pointer';
  }

  const A = (el, frames, dur, delay=0, easing=EASE.io) =>
    el.animate(frames, {duration: RM?1:dur, delay: RM?0:delay, easing, fill:'both'}).finished;

  async function go(){
    if (busy || phase >= 4) return;
    busy = true; $('hint').classList.add('off');
    const g = G, S0 = stateOf(phase), S1 = stateOf(phase+1), P = [];
    if (phase === 0){
      P.push(E.seal.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:RM?1:300}).finished);
      P.push(A(E.cFlap,[
        {transform:'rotateX(0deg)', filter:'brightness(1)', opacity:1},
        {transform:'rotateX(88deg)', filter:'brightness(.75)', opacity:1, offset:.97},
        {transform:'rotateX(90deg)', filter:'brightness(.75)', opacity:0}], 560, 220, EASE.in));
      for (const el of [E.oWrap, E.oFront]) P.push(A(el,[
        {transform:S0.oWrap.transform, opacity:0},
        {transform:S0.oWrap.transform, opacity:1, offset:.04},
        {transform:S0.oWrap.transform, opacity:1, offset:.38},
        {transform:S1.oWrap.transform, opacity:1}], 1500, 220, 'linear'));
      P.push(A(E.cBody,[{opacity:1},{opacity:0}], 320, 600, 'ease-out'));
      P.push(A(E.oFlap,[
        {transform:'rotateX(-90deg)', opacity:0, filter:'brightness(.7)'},
        {transform:'rotateX(-84deg)', opacity:1, filter:'brightness(.72)', offset:.06},
        {transform:'rotateX(0deg)', opacity:1, filter:'brightness(1)'}], 760, 770, EASE.back));
    }
    if (phase === 1){
      P.push(A(E.pp,[
        {transform:g.inEnv, zIndex:3},
        {transform:g.outEnv, zIndex:3, offset:.42},
        {transform:g.outEnv, zIndex:7, offset:.44},
        {transform:'translate(0px,0px) scale(1)', zIndex:7}], 1700, 0, EASE.io));
      for (const el of [E.oWrap, E.oFront]) P.push(A(el,[
        {transform:S0.oWrap.transform, opacity:1},{transform:S1.oWrap.transform, opacity:0}], 900, 780, EASE.in));
    }
    if (phase === 2){
      E.spread.style.visibility = 'visible';
      E.pp.classList.remove('glint');
      P.push(A(E.pCover,[{transform:'rotateY(0deg)', filter:'brightness(1)'},{transform:'rotateY(-90deg)', filter:'brightness(.55)'}], 480, 0, EASE.in));
      P.push(A(E.pp,[{opacity:1},{opacity:1, offset:.92},{opacity:0}], 480, 0, 'linear'));
      P.push(A(E.spread,[{opacity:0, transform:'scale(.8)'},{opacity:1, transform:'scale(1)'}], 760, 300, EASE.out));
      P.push(A(E.pTop,[{transform:'rotateX(-90deg)', filter:'brightness(.7)'},{transform:'rotateX(0deg)', filter:'brightness(1)'}], 900, 420, EASE.back));
      P.push(A(E.ticket,[{transform:g.tPeekHidden, opacity:0},{transform:g.tPeekHidden, opacity:1, offset:.05},{transform:g.tPeek, opacity:1}], 800, 1250, EASE.out));
    }
    if (phase === 3){
      P.push(A(E.ticket,[
        {transform:g.tPeek, zIndex:5},
        {transform:g.tOut, zIndex:5, offset:.34},
        {transform:g.tOut, zIndex:7, offset:.36},
        {transform:g.tFinal, zIndex:7}], 1600, 0, EASE.io));
      P.push(A(E.spread,[{opacity:1, transform:'scale(1)', filter:'blur(0px)'},{opacity:.2, transform:'scale(.9)', filter:'blur(2px)'}], 900, 550, EASE.out));
      head.style.opacity = 0;
      setTimeout(burst, RM ? 0 : 1350);
    }
    await Promise.all(P);
    phase++; busy = false; apply(phase);
  }

  function reset(){ phase = 0; busy = false; apply(0); stage.focus({preventScroll:true}); }

  stage.addEventListener('click', go);
  stage.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
  $('rsvp').addEventListener('click', e => e.stopPropagation());
  $('replay').addEventListener('click', e => { e.stopPropagation(); reset(); });
  $('copy').addEventListener('click', async e => {
    e.stopPropagation();
    const t = $('copyText');
    try { await navigator.clipboard.writeText('0897775642'); t.textContent = 'Number copied'; }
    catch { const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    setTimeout(()=>{ t.textContent = '0897 775 642'; }, 1800);
  });
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!busy){ layout(); apply(phase); } }, 120); });

  // petals + gold flecks on ticket reveal
  const cv = $('fx'), ctx = cv.getContext('2d');
  function burst(){
    if (RM) return;
    const dpr = Math.min(devicePixelRatio||1, 2), W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cols = ['#7b1f2c','#9b2d3c','#a8834a','#d9bf8c','#f3e9d8','#2b3f66'];
    const ps = Array.from({length:90}, () => ({
      x: W/2 + (Math.random()-.5)*W*.3, y: H*.45 + (Math.random()-.5)*60,
      vx: (Math.random()-.5)*9, vy: -Math.random()*9-3, r: Math.random()*5+3,
      a: Math.random()*6.28, va: (Math.random()-.5)*.25, c: cols[(Math.random()*cols.length)|0], w: Math.random()*6.28 }));
    const t0 = performance.now();
    (function f(t){
      const el = (t - t0)/1000; ctx.clearRect(0,0,W,H);
      for (const p of ps){
        p.vy += .22; p.vx *= .985; p.vy *= .985; p.w += .08;
        p.x += p.vx + Math.sin(p.w)*.8; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - el/3.6);
        ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*.55*Math.abs(Math.cos(p.w)) + .6,0,0,6.28); ctx.fill(); ctx.restore();
      }
      if (el < 3.8) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H);
    })(t0);
  }

  // start once images are decoded
  const imgs = [...document.querySelectorAll('#stage img')];
  Promise.all(imgs.map(i => i.decode ? i.decode().catch(()=>{}) : Promise.resolve())).then(() => {
    layout(); apply(0);
    requestAnimationFrame(() => { stage.classList.add('ready'); $('loader').classList.add('gone'); });
  });
  window.__inv = { go, reset, get phase(){ return phase; } };
})();
</script>
